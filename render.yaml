services:
  - type: web
    name: aegispay-sentinel
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
